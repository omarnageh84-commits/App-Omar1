<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>المهام</title>
<script src="themes.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal','IBM Plex Sans Arabic',sans-serif}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
body{display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;width:100%;position:relative}
.nu-scroll::-webkit-scrollbar{width:0;display:none}
.nu-scroll{scrollbar-width:none}
.top-bar{background:var(--card);border-bottom:1.5px solid var(--card-border);padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search-input{flex:1;border:1.5px solid var(--card-border);background:var(--bg-soft);border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700;color:var(--text);outline:none;min-width:140px}
.filter-row{display:flex;gap:6px;overflow:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--card-border);scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{padding:6px 12px;border-radius:99px;border:1.5px solid var(--card-border);background:var(--card);font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap;color:var(--text-soft);transition:.2s;flex-shrink:0}
.filter-chip.active{background:var(--hero);color:#fff;border-color:var(--hero)}
#board{flex:1;overflow:auto;padding:8px 8px 90px 8px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.task-outer{display:flex;gap:6px;align-items:stretch}
.task-card{flex:1;background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;padding:12px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;position:relative;overflow:hidden;transition:.2s}
.task-card:active{transform:scale(.98)}
.task-progress-full{position:absolute;top:0;right:0;bottom:0;pointer-events:none;transition:width.35s ease;z-index:0;opacity:.12}
.task-card-content{position:relative;z-index:1;display:flex;gap:10px;align-items:center;width:100%}
.task-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--bg-soft);border:1px solid var(--card-border)}
.task-info{flex:1;min-width:0}
.task-info b{display:block;font-size:12px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-info small{display:block;font-size:9px;color:var(--text-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--card-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--card)}
.task-check.done{background:var(--hero);border-color:var(--hero);color:#fff}
.ext-del{width:40px;border-radius:12px;border:1.5px solid #FECDD3;background:#FFF1F2;color:#ef4444;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#fab{position:absolute;bottom:18px;left:18px;width:56px;height:56px;border-radius:18px;background:var(--hero);color:#fff;border:none;font-size:28px;font-weight:800;box-shadow:0 10px 26px color-mix(in srgb, var(--hero) 35%, transparent);cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center}
#modal{display:none;position:fixed;inset:0;background:var(--bg);z-index:9999;flex-direction:column;width:100%;height:100%}
#modal.show{display:flex}
.pro-header{padding:12px;background:var(--card);border-bottom:1.5px solid var(--card-border);display:flex;align-items:center;gap:10px;position:relative}
.pro-header::before{content:'';position:absolute;top:0;right:0;left:0;height:4px;background:var(--hero)}
.pro-title-input{flex:1;border:none;outline:none;background:transparent;font-size:16px;font-weight:900;color:var(--text);width:100%}
.pro-close{width:36px;height:36px;border-radius:10px;background:var(--bg-soft);border:1.5px solid var(--card-border);color:var(--text);font-size:16px;cursor:pointer;flex-shrink:0}
.pro-meta{background:var(--card);padding:10px 12px;display:flex;gap:8px;border-bottom:1px solid var(--card-border);align-items:center;flex-wrap:wrap}
.pro-select{flex:1;min-width:110px;border:1.5px solid var(--card-border);background:var(--bg-soft);border-radius:10px;padding:9px 10px;font-size:11px;font-weight:700;color:var(--text);outline:none}
.pro-segment{display:flex;gap:4px;background:var(--bg-soft);padding:5px;border-radius:12px;margin:10px 12px;border:1.5px solid var(--card-border);overflow:auto}
.pro-seg-btn{flex:1;padding:9px 6px;border:none;border-radius:9px;background:transparent;font-size:10px;font-weight:800;color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.pro-seg-btn.active{background:var(--card);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.08);border:1.5px solid var(--card-border)}
.pane{display:none;flex:1;flex-direction:column;padding:12px;overflow:auto;gap:10px;background:var(--bg)}
.pane.active{display:flex}
.card{background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;padding:12px}
.input-pro{width:100%;border:1.5px solid var(--card-border);border-radius:10px;padding:10px;background:var(--bg-soft);color:var(--text);font-size:12px;font-weight:600;outline:none}
#toastContainer{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:15000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast-pro{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:260px;max-width:340px;pointer-events:auto;animation:toastIn.3s ease}
.toast-pro.success{border-color:#16a34a;background:#f0fdf4}
.toast-pro.error{border-color:#ef4444;background:#fef2f2}
.toast-pro-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <input id="search" class="search-input" placeholder="🔍 اكتب مهمة جديدة واضغط Enter..." onkeydown="if(event.key==='Enter') quickAdd(this.value)">
    <button onclick="openManager()" style="border:1.5px solid var(--card-border);background:var(--card);border-radius:10px;padding:8px 12px;font-size:11px;font-weight:800;color:var(--text)">⚙</button>
  </div>
  <div class="filter-row nu-scroll" id="filterRow"></div>
  <div id="board" class="nu-scroll"></div>
  <button id="fab" onclick="openModal()">+</button>
</div>
<div id="modal">
  <div class="pro-header">
    <input id="mTitle" class="pro-title-input" placeholder="عنوان المهمة...">
    <button class="pro-close" onclick="closeModal()">✕</button>
  </div>
  <div class="pro-meta">
    <select id="mCat" class="pro-select"></select>
    <select id="mPri" class="pro-select">
      <option value="عادي">⚪ عادي</option>
      <option value="متوسط">🟡 متوسط</option>
      <option value="مهم">🔴 مهم</option>
    </select>
    <input id="mColor" type="color" value="#16A34A" style="width:44px;height:38px;border-radius:10px;border:1.5px solid var(--card-border);padding:2px;background:var(--card)">
  </div>
  <div class="pro-segment">
    <button class="pro-seg-btn active" onclick="switchPane('details',this)">📝 تفاصيل</button>
    <button class="pro-seg-btn" onclick="switchPane('sub',this)">📋 فرعية</button>
    <button class="pro-seg-btn" onclick="switchPane('notes',this)">📌 ملاحظات</button>
  </div>
  <div id="pane-details" class="pane active">
    <div class="card"><label style="font-size:10px;font-weight:800;display:block;margin-bottom:6px">الوصف</label><textarea id="mDesc" class="input-pro" rows="3" placeholder="تفاصيل المهمة..."></textarea></div>
    <div class="card"><label style="font-size:10px;font-weight:800;display:block;margin-bottom:6px">تاريخ الاستحقاق</label><input id="mDate" type="date" class="input-pro"></div>
    <button onclick="saveTask()" style="background:var(--hero);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:900;font-size:13px;cursor:pointer">💾 حفظ المهمة</button>
    <button id="btnDelTask" onclick="deleteCurrent()" style="display:none;background:#FFF1F2;color:#ef4444;border:1.5px solid #FECDD3;border-radius:12px;padding:10px;font-weight:800">🗑 حذف المهمة</button>
  </div>
  <div id="pane-sub" class="pane">
    <div id="subList" style="display:flex;flex-direction:column;gap:6px"></div>
    <div style="display:flex;gap:6px"><input id="newSub" class="input-pro" placeholder="مهمة فرعية جديدة..." style="flex:1"><button onclick="addSub()" style="background:var(--hero);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:800">+</button></div>
  </div>
  <div id="pane-notes" class="pane">
    <textarea id="mNotes" class="input-pro" rows="6" placeholder="ملاحظات داخلية..."></textarea>
  </div>
</div>

<div id="managerModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(6px)">
  <div style="background:var(--card);width:100%;max-width:380px;border-radius:16px;padding:14px;border:1.5px solid var(--card-border)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b style="font-size:13px">إدارة الفئات</b><button onclick="closeManager()" style="border:none;background:var(--bg-soft);width:30px;height:30px;border-radius:8px">✕</button></div>
    <div style="display:flex;gap:6px;margin-bottom:10px"><input id="newCatEmoji" placeholder="📌" style="width:50px" class="input-pro"><input id="newCatName" placeholder="اسم الفئة" class="input-pro" style="flex:1"><button onclick="addCategory()" style="background:var(--hero);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-weight:800">+</button></div>
    <div id="catList" style="max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px"></div>
  </div>
</div>

<div id="toastContainer"></div>
<script>
let cats = JSON.parse(localStorage.getItem('omar_cats_v1')||'[{"id":1,"emoji":"📌","name":"عام"},{"id":2,"emoji":"🏠","name":"البيت"},{"id":3,"emoji":"💼","name":"الشغل"}]');
let tasks = JSON.parse(localStorage.getItem('omar_tasks_v1')||'[]');
let curFilter='الكل';
let editingId=null;
let curSubs=[];

function showToast(title, sub='', type='success'){
  let c=document.getElementById('toastContainer');
  let t=document.createElement('div'); t.className='toast-pro '+type;
  t.innerHTML=`<div class="toast-pro-icon">${type==='success'?'✅':'⚠'}</div><div class="toast-pro-text"><div class="toast-pro-title">${title}</div>${sub?`<div class="toast-pro-sub">${sub}</div>`:''}</div>`;
  c.appendChild(t); setTimeout(()=>{t.style.animation='toastOut.3s ease forwards'; setTimeout(()=>t.remove(),300)},2600);
}
function saveLS(){
  localStorage.setItem('omar_cats_v1', JSON.stringify(cats));
  localStorage.setItem('omar_tasks_v1', JSON.stringify(tasks));
  try{ if(window.parent && window.parent!==window && window.parent.backupToDrive) window.parent.backupToDrive(); }catch(e){}
}
function getProgress(t){
  if(!t.subs ||!t.subs.length) return t.done?100:0;
  let done=t.subs.filter(s=>s.done).length;
  return Math.round(done/t.subs.length*100);
}
function renderFilters(){
  let row=document.getElementById('filterRow');
  let all=['الكل',...cats.map(c=>c.name),'منتهي'];
  row.innerHTML=all.map(n=>`<button class="filter-chip ${curFilter===n?'active':''}" onclick="setFilter('${n}')">${n==='الكل'?'🔥 الكل':n==='منتهي'?'✅ منتهي':(cats.find(c=>c.name===n)?.emoji||'📌')+' '+n}</button>`).join('');
  let sel=document.getElementById('mCat');
  if(sel) sel.innerHTML=cats.map(c=>`<option value="${c.name}">${c.emoji} ${c.name}</option>`).join('');
}
function setFilter(n){curFilter=n; render();}
function render(){
  renderFilters();
  let board=document.getElementById('board');
  let q=(document.getElementById('search')?.value||'').trim();
  let list=[...tasks];
  if(curFilter!=='الكل'){
    if(curFilter==='منتهي') list=list.filter(t=>t.done);
    else list=list.filter(t=>t.cat===curFilter);
  }
  if(q &&!q.startsWith('27943') &&!q.startsWith(localStorage.getItem('omar_hidden_code_v1')||'___')){
    if(q && q.length>1) list=list.filter(t=> (t.text||'').includes(q) || (t.desc||'').includes(q));
  }
  let order={'مهم':0,'متوسط':1,'عادي':2};
  list.sort((a,b)=> (order[a.priority]||2)-(order[b.priority]||2));
  if(!list.length){
    board.innerHTML=`<div style="text-align:center;padding:40px 10px;color:var(--text-soft)"><div style="font-size:40px">📭</div><div style="font-size:12px;font-weight:800;margin-top:8px">مفيش مهام هنا</div><div style="font-size:9px;margin-top:4px">دوس + عشان تضيف</div></div>`;
    return;
  }
  board.innerHTML=list.map(t=>{
    let prog=getProgress(t);
    let catObj=cats.find(c=>c.name===t.cat);
    let emoji=catObj?catObj.emoji:'📌';
    let priColor=t.priority==='مهم'?'#ef4444':t.priority==='متوسط'?'#f59e0b':'var(--card-border)';
    let bg=t.color||'var(--hero)';
    return `<div class="task-outer">
      <div class="task-card" style="border-right:4px solid ${priColor}" onclick="editTask('${t.id}')">
        <div class="task-progress-full" style="width:${prog}%;background:${bg}"></div>
        <div class="task-card-content">
          <div class="task-icon" style="background:${bg}18;border-color:${bg}40">${emoji}</div>
          <div class="task-info"><b style="${t.done?'text-decoration:line-through;opacity:.6':''}">${t.text||'بدون عنوان'}</b><small>${t.cat||'عام'} • ${t.priority||'عادي'} ${t.subs?.length?`• ${t.subs.filter(s=>s.done).length}/${t.subs.length}`:''} ${prog?`• ${prog}%`:''}</small></div>
          <div class="task-check ${t.done?'done':''}" onclick="event.stopPropagation();toggleDone('${t.id}')">${t.done?'✓':''}</div>
        </div>
      </div>
      <button class="ext-del" onclick="confirmDel('${t.id}')">✕</button>
    </div>`;
  }).join('');
}
function toggleDone(id){
  let t=tasks.find(x=>x.id===id);
  if(!t) return;
  t.done=!t.done;
  if(t.subs) t.subs.forEach(s=>s.done=t.done);
  saveLS(); render(); showToast(t.done?'تم الإنجاز':'تم الإرجاع');
}
function quickAdd(v){
  if(!v.trim()) return;
  let code=localStorage.getItem('omar_hidden_code_v1')||'27943';
  if(v.startsWith(code+' ')||v.startsWith('27943 ')){
    let txt=v.split(' ').slice(1).join(' ');
    tasks.unshift({id:Date.now().toString(),text:txt,cat:cats[0]?.name||'عام',priority:'مهم',desc:'',notes:'',subs:[],color:'#ef4444',done:false,date:new Date().toISOString()});
    saveLS(); render(); showToast('مهمة مخفية مضافة','🔴 مهم');
    document.getElementById('search').value=''; return;
  }
  tasks.unshift({id:Date.now().toString(),text:v.trim(),cat:cats[0]?.name||'عام',priority:'عادي',desc:'',notes:'',subs:[],color:'var(--hero)',done:false,date:new Date().toISOString()});
  saveLS(); render(); document.getElementById('search').value=''; showToast('تمت الإضافة');
}
function openModal(){
  editingId=null; curSubs=[];
  document.getElementById('mTitle').value='';
  document.getElementById('mDesc').value='';
  document.getElementById('mNotes').value='';
  document.getElementById('mDate').value=new Date().toISOString().slice(0,10);
  document.getElementById('mCat').value=cats[0]?.name||'عام';
  document.getElementById('mPri').value='عادي';
  document.getElementById('mColor').value='#16A34A';
  document.getElementById('btnDelTask').style.display='none';
  document.getElementById('subList').innerHTML='';
  document.getElementById('modal').classList.add('show');
  switchPane('details', document.querySelector('.pro-seg-btn'));
}
function closeModal(){document.getElementById('modal').classList.remove('show'); editingId=null;}
function editTask(id){
  let t=tasks.find(x=>x.id===id); if(!t) return;
  editingId=id; curSubs=[...(t.subs||[])];
  document.getElementById('mTitle').value=t.text||'';
  document.getElementById('mDesc').value=t.desc||'';
  document.getElementById('mNotes').value=t.notes||'';
  document.getElementById('mDate').value=t.date?.slice(0,10)||'';
  document.getElementById('mCat').value=t.cat||cats[0].name;
  document.getElementById('mPri').value=t.priority||'عادي';
  document.getElementById('mColor').value=t.color && t.color.startsWith('#')?t.color:'#16A34A';
  document.getElementById('btnDelTask').style.display='block';
  renderSubs(); document.getElementById('modal').classList.add('show');
}
function renderSubs(){
  let el=document.getElementById('subList');
  if(!curSubs.length){el.innerHTML='<div style="text-align:center;color:var(--text-soft);font-size:10px;padding:10px">لا يوجد مهام فرعية</div>'; return;}
  el.innerHTML=curSubs.map((s,i)=>`<div style="display:flex;gap:6px;align-items:center;background:var(--bg-soft);border:1.5px solid var(--card-border);border-radius:10px;padding:8px"><input type="checkbox" ${s.done?'checked':''} onchange="curSubs[${i}].done=this.checked"><input value="${s.text||''}" oninput="curSubs[${i}].text=this.value" class="input-pro" style="flex:1;padding:6px;font-size:11px"><button onclick="curSubs.splice(${i},1);renderSubs()" style="border:none;background:#FFF1F2;color:#ef4444;width:28px;height:28px;border-radius:7px">✕</button></div>`).join('');
}
function addSub(){
  let inp=document.getElementById('newSub');
  if(!inp.value.trim()) return;
  curSubs.push({text:inp.value.trim(),done:false});
  inp.value=''; renderSubs();
}
function switchPane(name,btn){
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('pane-'+name).classList.add('active');
  if(btn){ document.querySelectorAll('.pro-seg-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
}
function saveTask(){
  let title=document.getElementById('mTitle').value.trim();
  if(!title){ showToast('اكتب العنوان','العنوان مطلوب','error'); return;}
  let payload={
    id: editingId||Date.now().toString(),
    text:title,
    cat:document.getElementById('mCat').value,
    priority:document.getElementById('mPri').value,
    color:document.getElementById('mColor').value,
    desc:document.getElementById('mDesc').value,
    notes:document.getElementById('mNotes').value,
    date:document.getElementById('mDate').value,
    subs:curSubs,
    done: editingId? (tasks.find(t=>t.id===editingId)?.done||false) : false
  };
  if(editingId){
    let idx=tasks.findIndex(t=>t.id===editingId);
    if(idx>=0) tasks[idx]={...tasks[idx],...payload};
  }else tasks.unshift(payload);
  saveLS(); render(); closeModal(); showToast('تم الحفظ ✅');
}
function confirmDel(id){ if(confirm('مسح المهمة دي؟')){ tasks=tasks.filter(t=>t.id!==id); saveLS(); render(); showToast('تم الحذف'); } }
function deleteCurrent(){ if(!editingId) return; if(confirm('مسح نهائي؟')){ tasks=tasks.filter(t=>t.id!==editingId); saveLS(); render(); closeModal(); showToast('تم الحذف'); } }
function openManager(){document.getElementById('managerModal').style.display='flex'; renderManagerLists();}
function closeManager(){document.getElementById('managerModal').style.display='none';}
function addCategory(){let n=document.getElementById('newCatName').value.trim(),e=document.getElementById('newCatEmoji').value.trim()||'📌';if(!n)return;cats.push({id:Date.now(),emoji:e,name:n});document.getElementById('newCatName').value='';renderManagerLists();render();saveLS();}
function delCat(id){cats=cats.filter(c=>c.id!==id);renderManagerLists();render();saveLS();}
function renderManagerLists(){
  let catSel=document.getElementById('mCat');
  if(catSel) catSel.innerHTML=cats.map(c=>`<option value="${c.name}">${c.emoji} ${c.name}</option>`).join('');
  let catList=document.getElementById('catList');
  if(catList) catList.innerHTML=cats.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft);padding:8px 10px;border-radius:10px;border:1.5px solid var(--card-border)"><div style="font-size:11px"> ${c.emoji} <b>${c.name}</b></div><button onclick="delCat(${c.id})" style="border:none;background:#FEE2E2;width:26px;height:26px;border-radius:7px;color:#ef4444">✕</button></div>`).join('');
}
try{
  let cur=localStorage.getItem('omar_theme')||'green';
  if(window.applyTheme) applyTheme(cur,false);
}catch(e){}
render();
</script>
</body>
</html>
