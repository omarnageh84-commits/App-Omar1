<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>المهام</title>
<script src="themes.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal','IBM Plex Sans Arabic',sans-serif}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
body{display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;width:100%;position:relative}
.nu-scroll::-webkit-scrollbar{width:0;display:none}
.nu-scroll{scrollbar-width:none}
.top-bar{background:var(--card);border-bottom:1.5px solid var(--card-border);padding:10px 12px;display:flex;gap:8px;align-items:center}
.search-input{flex:1;border:1.5px solid var(--card-border);background:var(--bg-soft);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:700;color:var(--text);outline:none;min-width:0}
.btn-add{background:var(--hero);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap}
.btn-icon{border:1.5px solid var(--card-border);background:var(--card);border-radius:10px;padding:8px 12px;font-size:11px;font-weight:800;color:var(--text);cursor:pointer}
.filter-row{display:flex;gap:6px;overflow:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--card-border);scrollbar-width:none}
.filter-chip{padding:7px 13px;border-radius:99px;border:1.5px solid var(--card-border);background:var(--card);font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap;color:var(--text-soft);transition:.2s;flex-shrink:0}
.filter-chip.active{background:var(--hero);color:#fff;border-color:var(--hero)}
.filter-chip.hidden-active{background:#111;color:#fff;border-color:#111}
#board{flex:1;overflow:auto;padding:8px 8px 90px 8px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.task-outer{display:flex;gap:6px;align-items:stretch}
.task-card{flex:1;background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;padding:0;display:flex;align-items:center;cursor:pointer;position:relative;overflow:hidden;min-height:62px}
.task-progress-bg{position:absolute;top:0;right:0;bottom:0;pointer-events:none;transition:width .4s ease;z-index:0;background:var(--hero);opacity:.32}
.task-card-content{position:relative;z-index:1;display:flex;gap:10px;align-items:center;width:100%;padding:12px}
.task-info{flex:1;min-width:0}
.task-info b{display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-info small{display:block;font-size:9px;color:var(--text-soft);margin-top:2px}
.task-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--card-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--card)}
.task-check.done{background:var(--hero);border-color:var(--hero);color:#fff}
.ext-del{width:40px;border-radius:12px;border:1.5px solid #FECDD3;background:#FFF1F2;color:#ef4444;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#fab{position:absolute;bottom:18px;left:18px;width:56px;height:56px;border-radius:18px;background:var(--hero);color:#fff;border:none;font-size:28px;font-weight:800;box-shadow:0 10px 26px color-mix(in srgb, var(--hero) 35%, transparent);cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center}
#modal{display:none;position:fixed;inset:0;background:var(--bg);z-index:9999;flex-direction:column;width:100%;height:100%}
#modal.show{display:flex}
.pro-header{padding:12px;background:var(--card);border-bottom:1.5px solid var(--card-border);display:flex;align-items:center;gap:10px}
.pro-title-input{flex:1;border:none;outline:none;background:transparent;font-size:16px;font-weight:900;color:var(--text);width:100%}
.pro-close{width:36px;height:36px;border-radius:10px;background:var(--bg-soft);border:1.5px solid var(--card-border);color:var(--text);font-size:16px;cursor:pointer;flex-shrink:0}
.pro-meta{background:var(--card);padding:10px 12px;display:flex;gap:8px;border-bottom:1px solid var(--card-border);flex-wrap:wrap}
.pro-select{flex:1;min-width:110px;border:1.5px solid var(--card-border);background:var(--bg-soft);border-radius:10px;padding:9px 10px;font-size:11px;font-weight:700;color:var(--text);outline:none}
.pro-segment{display:flex;gap:4px;background:var(--bg-soft);padding:5px;border-radius:12px;margin:10px 12px;border:1.5px solid var(--card-border);overflow:auto}
.pro-seg-btn{flex:1;padding:9px 6px;border:none;border-radius:9px;background:transparent;font-size:9.5px;font-weight:800;color:var(--text-soft);cursor:pointer;white-space:nowrap;min-width:70px}
.pro-seg-btn.active{background:var(--card);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.08);border:1.5px solid var(--card-border)}
.pane{display:none;flex:1;flex-direction:column;padding:12px;overflow:auto;gap:10px;background:var(--bg)}
.pane.active{display:flex}
.card{background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;padding:12px}
.input-pro{width:100%;border:1.5px solid var(--card-border);border-radius:10px;padding:10px;background:var(--bg-soft);color:var(--text);font-size:12px;font-weight:600;outline:none}
.rich-toolbar{display:flex;gap:4px;flex-wrap:wrap;background:var(--bg-soft);border:1.5px solid var(--card-border);border-radius:10px 10px 0 0;padding:6px}
.rich-toolbar button{border:1px solid var(--card-border);background:var(--card);border-radius:7px;padding:5px 8px;font-size:11px;font-weight:700;cursor:pointer}
.rich-editor{min-height:220px;max-height:420px;overflow:auto;padding:12px;background:var(--card);border:1.5px solid var(--card-border);border-top:none;border-radius:0 0 10px 10px;outline:none;font-size:13px;line-height:1.7}
#toastContainer{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:15000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast-pro{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;padding:10px 14px;display:flex;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:260px;max-width:340px;pointer-events:auto;animation:toastIn .3s ease}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.color-dot{width:28px;height:28px;border-radius:8px;border:2px solid var(--card-border);cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <input id="search" class="search-input" placeholder="اكتب مهمة جديدة واضغط Enter أو إضافة..." oninput="handleSearchInput(this.value)" onkeydown="if(event.key==='Enter') quickAdd(this.value)">
    <button class="btn-add" onclick="quickAdd(document.getElementById('search').value)">+ إضافة</button>
    <button class="btn-icon" onclick="openManager()">⚙️</button>
  </div>
  <div class="filter-row nu-scroll" id="filterRow"></div>
  <div id="board" class="nu-scroll"></div>
  <button id="fab" onclick="openModal()">+</button>
</div>

<div id="modal">
  <div class="pro-header">
    <input id="mTitle" class="pro-title-input" placeholder="عنوان المهمة...">
    <button class="pro-close" onclick="closeModal()">✕</button>
  </div>
  <div class="pro-meta">
    <select id="mCat" class="pro-select"></select>
    <select id="mPri" class="pro-select"><option value="عادي">⚪ عادي</option><option value="متوسط">🟡 متوسط</option><option value="مهم">🔴 مهم</option></select>
    <input id="mColor" type="color" value="#16A34A" style="width:44px;height:38px;border-radius:10px;border:1.5px solid var(--card-border);padding:2px;background:var(--card)">
    <input id="mDate" type="date" class="pro-select" style="max-width:140px">
  </div>
  <div class="pro-segment">
    <button class="pro-seg-btn active" onclick="switchPane('sub',this)">📋 فرعية</button>
    <button class="pro-seg-btn" onclick="switchPane('notes',this)">📌 ملاحظات</button>
    <button class="pro-seg-btn" onclick="switchPane('media',this)">🎬 وسائط</button>
    <button class="pro-seg-btn" onclick="switchPane('table',this)">📊 جدول</button>
    <button class="pro-seg-btn" onclick="switchPane('reminder',this)">🔔 تذكير</button>
  </div>
  <div id="pane-sub" class="pane active">
    <div id="subList" style="display:flex;flex-direction:column;gap:6px"></div>
    <div style="display:flex;gap:6px"><input id="newSub" class="input-pro" placeholder="مهمة فرعية جديدة... Enter للإضافة" onkeydown="if(event.key==='Enter') addSub()" style="flex:1"><button onclick="addSub()" class="btn-add">+</button></div>
    <div style="margin-top:6px"><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-soft);margin-bottom:4px"><span>التقدم</span><span id="subProgText">0%</span></div><div style="height:8px;background:var(--bg-soft);border-radius:99px;overflow:hidden;border:1px solid var(--card-border)"><div id="subProgBar" style="height:100%;width:0%;background:var(--hero);transition:width .3s"></div></div></div>
    <button onclick="saveTask()" style="margin-top:10px;background:var(--hero);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:900">💾 حفظ</button>
  </div>
  <div id="pane-notes" class="pane">
    <div class="rich-toolbar">
      <button onclick="richCmd('bold')"><b>B</b></button><button onclick="richCmd('italic')"><i>I</i></button>
      <button onclick="openColorPicker('text')">🎨 لون الخط</button><button onclick="openColorPicker('bg')">🖌️ تظليل</button>
      <button onclick="richCmd('insertUnorderedList')">• نقاط</button><button onclick="richCmd('insertOrderedList')">1. ترقيم</button>
      <button onclick="changeRichSize(1)">A+</button><button onclick="changeRichSize(-1)">A-</button>
      <button onclick="richCmd('removeFormat')">🧹 مسح</button>
    </div>
    <div id="richEditor" class="rich-editor" contenteditable="true" placeholder="اكتب ملاحظاتك هنا..."></div>
    <div id="colorPicker" style="display:none;gap:6px;flex-wrap:wrap;padding:8px;background:var(--bg-soft);border-radius:10px;border:1.5px solid var(--card-border);margin-top:6px">
      <div class="color-dot" style="background:#ef4444" onclick="applyColor('#ef4444')"></div>
      <div class="color-dot" style="background:#22c55e" onclick="applyColor('#22c55e')"></div>
      <div class="color-dot" style="background:#3b82f6" onclick="applyColor('#3b82f6')"></div>
      <div class="color-dot" style="background:#f59e0b" onclick="applyColor('#f59e0b')"></div>
      <div class="color-dot" style="background:#000" onclick="applyColor('#000')"></div>
      <div class="color-dot" style="background:#facc15" onclick="applyColor('#facc15')"></div>
      <button onclick="document.getElementById('colorPicker').style.display='none'" style="border:none;background:var(--card);padding:6px 10px;border-radius:7px;font-size:10px">✕</button>
    </div>
    <button onclick="saveTask()" style="background:var(--hero);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:900">💾 حفظ الملاحظات</button>
  </div>
  <div id="pane-media" class="pane"><div id="mediaGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
      <button onclick="document.getElementById('imgInput').click()" style="flex:1;background:var(--bg-soft);border:1.5px solid var(--card-border);border-radius:10px;padding:10px;font-weight:800">📷 صور</button>
      <button onclick="openCamera()" style="flex:1;background:var(--bg-soft);border:1.5px solid var(--card-border);border-radius:10px;padding:10px;font-weight:800">📹 كاميرا</button>
      <button id="recBtn" onclick="toggleRec()" style="flex:1;background:var(--bg-soft);border:1.5px solid var(--card-border);border-radius:10px;padding:10px;font-weight:800">🎤 تسجيل</button>
    </div>
    <input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="handleImgs(this.files)">
    <video id="camPrev" autoplay playsinline style="display:none;width:100%;border-radius:12px;margin-top:8px;max-height:220px;background:#000"></video>
    <div id="camBtns" style="display:none;gap:6px;margin-top:6px"><button onclick="takePhoto()" style="flex:1;background:var(--hero);color:#fff;border:none;border-radius:10px;padding:10px;font-weight:900">📸 التقاط</button><button onclick="closeCamera()" style="flex:1;background:#FFF1F2;color:#ef4444;border:1.5px solid #FECDD3;border-radius:10px;padding:10px;font-weight:800">✕ إغلاق</button></div>
    <button onclick="saveTask()" style="background:var(--hero);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:900;margin-top:8px">💾 حفظ الوسائط</button>
  </div>
  <div id="pane-table" class="pane"><div style="display:flex;gap:6px;flex-wrap:wrap"><button onclick="addCol()" class="btn-icon">+ عمود</button><button onclick="addRow()" class="btn-icon">+ صف</button><button onclick="calcSum()" class="btn-icon">∑ جمع</button><button onclick="clearTable()" class="btn-icon" style="color:#ef4444">🗑️ مسح</button></div>
    <div style="overflow:auto;border:1.5px solid var(--card-border);border-radius:12px"><table id="mainTable" style="width:100%;border-collapse:collapse"><thead id="tableHead"></thead><tbody id="tableBody"></tbody><tfoot id="tableFoot"></tfoot></table></div>
    <button onclick="saveTask()" style="background:var(--hero);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:900">💾 حفظ الجدول</button>
  </div>
  <div id="pane-reminder" class="pane">
    <div class="card"><b style="font-size:11px;display:block;margin-bottom:8px">⏰ وقت التذكير</b><input id="remTime" type="datetime-local" class="input-pro"></div>
    <div class="card"><b style="font-size:11px;display:block;margin-bottom:8px">🔁 التكرار</b><select id="remRepeat" class="input-pro" onchange="toggleCustomRepeat()"><option value="once">مرة واحدة</option><option value="hourly">كل ساعة</option><option value="daily">يومياً</option><option value="weekly">أسبوعياً</option><option value="monthly">شهرياً</option><option value="custom">مخصص</option></select><div id="customRepeat" style="display:none;margin-top:8px"><input id="remCustomMin" type="number" placeholder="كل كم دقيقة" class="input-pro"></div></div>
    <div class="card"><b style="font-size:11px;display:block;margin-bottom:8px">🔊 النغمة</b>
      <label style="display:flex;gap:8px;align-items:center;background:var(--bg-soft);padding:8px;border-radius:10px;border:1.5px solid var(--card-border);margin-bottom:4px"><input type="radio" name="remSound" value="bell" checked> 🔔 جرس <button type="button" onclick="previewSound('bell')" style="margin-right:auto">▶️</button></label>
      <label style="display:flex;gap:8px;align-items:center;background:var(--bg-soft);padding:8px;border-radius:10px;border:1.5px solid var(--card-border);margin-bottom:4px"><input type="radio" name="remSound" value="chime"> 🎵 هادئ <button type="button" onclick="previewSound('chime')" style="margin-right:auto">▶️</button></label>
      <label style="display:flex;gap:8px;align-items:center;background:var(--bg-soft);padding:8px;border-radius:10px;border:1.5px solid var(--card-border)"><input type="radio" name="remSound" value="alert"> 🚨 قوي <button type="button" onclick="previewSound('alert')" style="margin-right:auto">▶️</button></label>
    </div>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:11px">تفعيل</b><input id="remEnabled" type="checkbox" checked onchange="updateRemToggle()"></div>
    <button onclick="saveTask()" style="background:var(--hero);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:900">💾 حفظ التذكير</button>
  </div>
</div>

<div id="managerModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;align-items:center;justify-content:center;padding:14px"><div style="background:var(--card);width:100%;max-width:380px;border-radius:16px;padding:14px;border:1.5px solid var(--card-border)"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><b style="font-size:13px">إدارة الفئات</b><button onclick="closeManager()" style="border:none;background:var(--bg-soft);width:30px;height:30px;border-radius:8px">✕</button></div><div style="display:flex;gap:6px;margin-bottom:10px"><input id="newCatEmoji" placeholder="📌" style="width:50px" class="input-pro"><input id="newCatName" placeholder="اسم الفئة" class="input-pro" style="flex:1"><button onclick="addCategory()" style="background:var(--hero);color:#fff;border:none;border-radius:10px;padding:9px 14px">+</button></div><div id="catList" style="max-height:200px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px"></div><div style="border-top:1.5px solid var(--card-border);padding-top:10px;margin-top:10px"><button onclick="clearAllData()" style="width:100%;background:#FFF1F2;color:#ef4444;border:1.5px solid #FECDD3;border-radius:10px;padding:10px;font-weight:900;font-size:11px">🗑️ مسح كل البيانات والبدء من جديد</button><div style="font-size:8px;color:var(--text-soft);margin-top:8px;text-align:center">💡 كود المخفي بيتغير من جوه تبويب المخفي فقط</div></div></div></div>
<div id="proDeleteModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20000;align-items:center;justify-content:center;padding:16px"><div style="background:var(--card);width:100%;max-width:340px;border-radius:20px;padding:18px;border:1.5px solid var(--card-border);text-align:center"><b>مسح المهمة؟</b><div style="display:flex;gap:8px;margin-top:14px"><button onclick="closeProDelete()" style="flex:1;background:var(--bg-soft);border:1.5px solid var(--card-border);border-radius:12px;padding:11px">إلغاء</button><button onclick="confirmProDelete()" style="flex:1;background:#ef4444;color:#fff;border:none;border-radius:12px;padding:11px">مسح</button></div></div></div>
<div id="hiddenCodeModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)"><div style="background:var(--card);width:100%;max-width:340px;border-radius:20px;padding:18px;border:1.5px solid var(--card-border)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b style="font-size:13px">🔒 إعدادات المخفي</b><button onclick="closeHiddenCodeModal()" style="border:none;background:var(--bg-soft);width:30px;height:30px;border-radius:8px">✕</button></div><div style="background:#111;color:#fff;border-radius:12px;padding:12px;margin-bottom:12px"><div style="font-size:9px;opacity:.7">الكود الحالي</div><div id="hiddenCurrentCode" style="font-size:18px;font-weight:900;letter-spacing:2px;margin-top:4px">****</div><div style="font-size:8px;opacity:.6;margin-top:6px">اضغط على العين عشان تظهره</div></div><div style="display:flex;gap:6px;margin-bottom:10px"><input id="hiddenNewCodeInput" placeholder="الكود الجديد" type="password" class="input-pro" style="flex:1;font-size:16px;letter-spacing:2px"><button onclick="toggleHiddenCodeEye()" style="border:1.5px solid var(--card-border);background:var(--bg-soft);border-radius:10px;padding:8px 12px">👁️</button></div><div style="display:flex;gap:8px"><button onclick="closeHiddenCodeModal()" style="flex:1;background:var(--bg-soft);border:1.5px solid var(--card-border);border-radius:12px;padding:11px;font-weight:800">إلغاء</button><button onclick="saveHiddenCodeInside()" style="flex:1;background:#111;color:#fff;border:none;border-radius:12px;padding:11px;font-weight:900">💾 حفظ الكود</button></div><div style="font-size:8px;color:var(--text-soft);margin-top:10px;text-align:center">💡 الكود ده بس اللي بيفتح المخفي، محدش هيشوفه بره</div></div></div>
<div id="toastContainer"></div>
<script>
let cats = JSON.parse(localStorage.getItem('omar_cats_v1')||'[{"id":1,"emoji":"📌","name":"عام"},{"id":2,"emoji":"🏠","name":"البيت"},{"id":3,"emoji":"💼","name":"الشغل"}]');
let tasks = JSON.parse(localStorage.getItem('omar_tasks_v1')||'[]');
let curFilter='الكل';
let hiddenVisible=false;
let editingId=null;
let curSubs=[];
let curMedia={images:[],audios:[]};
let curTable={cols:['الصنف','العدد','السعر'],rows:[['','','']]};
let colorMode='text';
let camStream=null;
let mediaRecorder=null,recChunks=[];

function showToast(t,s=''){let c=document.getElementById('toastContainer');let d=document.createElement('div');d.className='toast-pro';d.innerHTML=`<b style="font-size:11px">${t}</b><small>${s}</small>`;c.appendChild(d);setTimeout(()=>d.remove(),2500);}
function saveLS(){localStorage.setItem('omar_cats_v1',JSON.stringify(cats));localStorage.setItem('omar_tasks_v1',JSON.stringify(tasks));}
function getProgress(t){if(!t.subs||!t.subs.length) return t.done?100:0; return Math.round(t.subs.filter(s=>s.done).length/t.subs.length*100);}
function renderFilters(){
  let row=document.getElementById('filterRow');if(!row)return;
  let base=['الكل',...cats.map(c=>c.name),'منتهي'];
  let htmlChips=base.map(n=>{
    let c=cats.find(x=>x.name===n);
    let label=n==='الكل'?'🔥 الكل':n==='منتهي'?'✅ منتهي':`${c?.emoji||'📌'} ${n}`;
    return `<button class="filter-chip ${curFilter===n?'active':''}" onclick="setFilter('${n}')">${label}</button>`;
  }).join('');
  if(hiddenVisible){
    let cnt=tasks.filter(t=>(t.cat||'').trim()==='مخفي').length;

function addRow(){curTable.rows.push(new Array(curTable.cols.length).fill(''));renderTable();}
function calcSum(){calcFoot();showToast('تم الحساب');}
function clearTable(){if(confirm('مسح الجدول؟')){curTable.rows=[new Array(curTable.cols.length).fill('')];renderTable();}}
function saveTask(){
  let title=document.getElementById('mTitle').value.trim();if(!title){showToast('اكتب العنوان');return;}
  let payload={
    id:editingId||Date.now().toString(),
    text:title,
    cat:(document.getElementById('mCat').value||'').trim(),
    priority:document.getElementById('mPri').value,
    color:document.getElementById('mColor').value,
    date:document.getElementById('mDate').value,
    subs:curSubs,
    notes:document.getElementById('richEditor').innerText||'',
    notesHTML:document.getElementById('richEditor').innerHTML||'',
    media:JSON.parse(JSON.stringify(curMedia)),
    table:JSON.parse(JSON.stringify(curTable)),
    reminder:{time:document.getElementById('remTime')?.value||'',repeat:document.getElementById('remRepeat')?.value||'once',customMin:parseInt(document.getElementById('remCustomMin')?.value)||60,sound:document.querySelector('input[name="remSound"]:checked')?.value||'bell',enabled:document.getElementById('remEnabled')?.checked||false},
    done:editingId?(tasks.find(t=>t.id===editingId)?.done||false):false
  };
  if(editingId){let idx=tasks.findIndex(t=>t.id===editingId);if(idx>=0)tasks[idx]={...tasks[idx],...payload};}else tasks.unshift(payload);
  saveLS();render();document.getElementById('modal').classList.remove('show');editingId=null;showToast('تم الحفظ ✅');
}
let pendingDelId=null;
function openProDelete(id){if(id)pendingDelId=id;else if(editingId)pendingDelId=editingId;else return;document.getElementById('proDeleteModal').style.display='flex';}
function closeProDelete(){document.getElementById('proDeleteModal').style.display='none';pendingDelId=null;}
function confirmProDelete(){if(!pendingDelId)return;tasks=tasks.filter(t=>t.id!==pendingDelId);saveLS();render();closeProDelete();document.getElementById('modal').classList.remove('show');editingId=null;}
function openManager(){document.getElementById('managerModal').style.display='flex';renderManagerLists();}
function closeManager(){document.getElementById('managerModal').style.display='none';}
function addCategory(){let n=document.getElementById('newCatName').value.trim(),e=document.getElementById('newCatEmoji').value.trim()||'📌';if(!n)return;cats.push({id:Date.now(),emoji:e,name:n});document.getElementById('newCatName').value='';renderManagerLists();render();saveLS();}
function delCat(id){cats=cats.filter(c=>c.id!==id);renderManagerLists();render();saveLS();}
function clearAllData(){
  if(!confirm('متأكد عايز تمسح كل المهام والفئات وتبدأ من جديد؟ العملية نهائية')) return;
  localStorage.removeItem('omar_tasks_v1');
  localStorage.removeItem('omar_cats_v1');
  localStorage.removeItem('omar_hidden_code_v1');
  tasks=[];
  cats=[{id:1,emoji:'📌',name:'عام'},{id:2,emoji:'🏠',name:'البيت'},{id:3,emoji:'💼',name:'الشغل'}];
  hiddenVisible=false;
  curFilter='الكل';
  saveLS();
  renderManagerLists();
  render();
  closeManager();
  showToast('تم مسح كل البيانات - بتبدأ من جديد ✅');
}
function renderManagerLists(){let sel=document.getElementById('mCat');if(sel)sel.innerHTML=cats.map(c=>`<option value="${c.name}">${c.emoji} ${c.name}</option>`).join('')+`<option value="مخفي">🔒 مخفي</option>`;let list=document.getElementById('catList');if(list)list.innerHTML=cats.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft);padding:7px 9px;border-radius:8px;margin-bottom:5px;border:1px solid var(--card-border)"><div style="font-size:10px">${c.emoji} <b>${c.name}</b></div><button onclick="delCat(${c.id})" style="border:none;background:#FEE2E2;width:25px;height:25px;border-radius:6px;color:#ef4444">✕</button></div>`).join('');/* كود المخفي مخفي عن الإعدادات الخارجية */}
function saveHiddenCode(){ /* تم نقله جوه المخفي */ }
function toggleCustomRepeat(){let sel=document.getElementById('remRepeat');let c=document.getElementById('customRepeat');if(!sel||!c)return;c.style.display=sel.value==='custom'?'flex':'none';}
function previewSound(t){try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator();let g=ctx.createGain();o.connect(g);g.connect(ctx.destination);if(t==='bell'){o.frequency.value=880;g.gain.value=0.5;o.start();g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.8);setTimeout(()=>ctx.close(),900);}else if(t==='chime'){o.frequency.value=523;g.gain.value=0.4;o.start();o.frequency.linearRampToValueAtTime(659,ctx.currentTime+0.3);g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+1.2);setTimeout(()=>ctx.close(),1300);}else{o.frequency.value=440;o.type='square';g.gain.value=0.3;o.start();setTimeout(()=>{o.frequency.value=880},200);setTimeout(()=>ctx.close(),600);}}catch(e){}}
function checkReminders(){
  let now=new Date();
  tasks.forEach(t=>{
    let r=t.reminder;if(!r||!r.enabled||!r.time)return;
    let target=new Date(r.time);if(isNaN(target))return;
    let diff=now-target;
    if(diff>=0&&diff<65000){
      previewSound(r.sound||'bell');
      if(Notification&&Notification.permission==='granted'){new Notification('🔔 '+t.text,{body:t.cat});}else{showToast('🔔 تذكير: '+t.text);}
      if(r.repeat==='hourly'){let nt=new Date(target);nt.setHours(nt.getHours()+1);t.reminder.time=nt.toISOString().slice(0,16);}
      else if(r.repeat==='daily'){let nt=new Date(target);nt.setDate(nt.getDate()+1);t.reminder.time=nt.toISOString().slice(0,16);}
      else if(r.repeat==='weekly'){let nt=new Date(target);nt.setDate(nt.getDate()+7);t.reminder.time=nt.toISOString().slice(0,16);}
      else if(r.repeat==='monthly'){let nt=new Date(target);nt.setMonth(nt.getMonth()+1);t.reminder.time=nt.toISOString().slice(0,16);}
      else if(r.repeat==='custom'){let nt=new Date(target);nt.setMinutes(nt.getMinutes()+(r.customMin||60));t.reminder.time=nt.toISOString().slice(0,16);}
      else{t.reminder.enabled=false;}
      saveLS();
    }
  });
}
try{let cur=localStorage.getItem('omar_theme')||'green';if(window.applyTheme)applyTheme(cur,false);}catch(e){}
if('Notification' in window && Notification.permission==='default'){Notification.requestPermission();}
setInterval(checkReminders,30000);
renderManagerLists();render();checkReminders();
</script>
