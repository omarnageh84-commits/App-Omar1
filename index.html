<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16A34A">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon_192.png">
<style>
:root{--primary:#16A34A;--primary-soft:#DCFCE7;--bg:#F0FDF4;--card:#ffffff;--border:#BBF7D0}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'IBM Plex Sans Arabic',sans-serif}
html,body{height:100%;background:var(--bg);transition:background .3s}
body{display:flex;justify-content:center;align-items:flex-start}
.phone-shell{width:100%;max-width:430px;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;transition:background .3s}
.pageWrap{flex:1;position:relative;background:var(--bg);overflow:hidden}
.page{position:absolute;inset:0;width:100%;height:100%;border:none;opacity:0;pointer-events:none;transition:opacity .15s;background:var(--bg)}
.page.active{opacity:1;pointer-events:auto;z-index:2}
.nav{height:72px;margin:10px;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);border:1.5px solid var(--border);border-radius:20px;display:flex;align-items:center;padding:6px;gap:5px;z-index:10;transition:.3s}
.nav button{flex:1;height:100%;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;color:var(--primary);font-size:9px;font-weight:700;cursor:pointer;transition:.2s;opacity:.6}
.nav button.active{background:var(--primary);color:#fff;opacity:1;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.nav button .icon{font-size:18px}
</style>
</head>
<body>
<div class="phone-shell">
  <div class="pageWrap">
    <iframe data-page="home.html" src="home.html" class="page active" title="home"></iframe>
    <iframe data-page="daily.html" src="about:blank" class="page" title="daily"></iframe>
    <iframe data-page="attendance.html" src="about:blank" class="page" title="attendance"></iframe>
    <iframe data-page="tasks.html" src="about:blank" class="page" title="tasks"></iframe>
  </div>
  <nav class="nav" id="mainNav">
    <button class="active" onclick="switchPage('home.html',this)"><span class="icon">🏠</span><span>الرئيسية</span></button>
    <button onclick="switchPage('daily.html',this)"><span class="icon">📊</span><span>اليومية</span></button>
    <button onclick="switchPage('attendance.html',this)"><span class="icon">⏱️</span><span>الحضور</span></button>
    <button onclick="switchPage('tasks.html',this)"><span class="icon">✓</span><span>المهام</span></button>
  </nav>
</div>
<script src="drive-sync.js"></script>
<script>
const THEMES_MAP = {
  light:{primary:'#0f172a',bg:'#f8fafc',card:'#ffffff',border:'#e2e8f0'},
  dark:{primary:'#22c55e',bg:'#0f172a',card:'#1e293b',border:'#334155'},
  black:{primary:'#ffffff',bg:'#000000',card:'#111111',border:'#222222'},
  green:{primary:'#16A34A',bg:'#f0fdf4',card:'#ffffff',border:'#bbf7d0'},
  blue:{primary:'#2563eb',bg:'#eff6ff',card:'#ffffff',border:'#bfdbfe'},
  red:{primary:'#dc2626',bg:'#fef2f2',card:'#ffffff',border:'#fecaca'},
  purple:{primary:'#9333ea',bg:'#faf5ff',card:'#ffffff',border:'#e9d5ff'}
};
function applyNavTheme(k){
  const t = THEMES_MAP[k]||THEMES_MAP.light;
  const r = document.documentElement;
  r.style.setProperty('--primary', t.primary);
  r.style.setProperty('--bg', t.bg);
  r.style.setProperty('--card', t.card);
  r.style.setProperty('--border', t.border);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t.primary);
  document.querySelector('.phone-shell').style.background = t.bg;
}
function loadNavTheme(){
  const saved = localStorage.getItem('omar_theme')||'light';
  applyNavTheme(saved);
}
// listen to theme changes from home.html
window.addEventListener('storage', (e)=>{
  if(e.key==='omar_theme'){ applyNavTheme(e.newValue); }
});
// also poll because iframe same-origin
setInterval(()=>{
  const cur = localStorage.getItem('omar_theme');
  if(cur && cur!==window._lastNavTheme){ window._lastNavTheme=cur; applyNavTheme(cur); }
},500);

const frames=document.querySelectorAll('.page');
function switchPage(name,btn){
  frames.forEach(f=>{
    const is=f.dataset.page===name;
    f.classList.toggle('active',is);
    if(is && f.src.includes('about:blank')){ f.src=name; }
  });
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js?v=17').then(()=>console.log('PWA v17 ready'));
  caches.keys().then(keys=>keys.forEach(k=>{ if(!k.includes('v17')) caches.delete(k); }));
}
loadNavTheme();
</script>

</html>
