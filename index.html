<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16A34A">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon_192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'IBM Plex Sans Arabic',sans-serif}
html,body{height:100%;background:#F0FDF4}
body{display:flex;justify-content:center;align-items:flex-start}
.phone-shell{width:100%;max-width:430px;height:100dvh;background:#F0FDF4;position:relative;overflow:hidden;display:flex;flex-direction:column}
.pageWrap{flex:1;position:relative;background:#F0FDF4;overflow:hidden}
.page{position:absolute;inset:0;width:100%;height:100%;border:none;opacity:0;pointer-events:none;transition:opacity .15s;background:#F0FDF4}
.page.active{opacity:1;pointer-events:auto;z-index:2}
.nav{height:72px;margin:10px;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);border:1.5px solid #BBF7D0;border-radius:20px;display:flex;align-items:center;padding:6px;gap:5px;z-index:10}
.nav button{flex:1;height:100%;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;color:#4ADE80;font-size:9px;font-weight:700;cursor:pointer}
.nav button.active{background:#16A34A;color:#fff}
.nav button .icon{font-size:18px}
</style>
<script src="themes.js"></script>
</head>
<body>
<div class="phone-shell">
  <div class="pageWrap">
    <iframe data-page="home.html" src="home.html" class="page active" title="home"></iframe>
    <iframe data-page="daily.html" src="about:blank" class="page" title="daily"></iframe>
    <iframe data-page="attendance.html" src="about:blank" class="page" title="attendance"></iframe>
    <iframe data-page="tasks.html" src="about:blank" class="page" title="tasks"></iframe>
  </div>
  <nav class="nav">
    <button class="active" onclick="switchPage('home.html',this)"><span class="icon">🏠</span><span>الرئيسية</span></button>
    <button onclick="switchPage('daily.html',this)"><span class="icon">📊</span><span>اليومية</span></button>
    <button onclick="switchPage('attendance.html',this)"><span class="icon">⏱️</span><span>الحضور</span></button>
    <button onclick="switchPage('tasks.html',this)"><span class="icon">✓</span><span>المهام</span></button>
  </nav>
</div>
<script src="drive-sync.js"></script>
<script>
const frames=document.querySelectorAll('.page');
function switchPage(name,btn){
  frames.forEach(f=>{
    const is=f.dataset.page===name;
    f.classList.toggle('active',is);
    if(is && f.src.includes('about:blank')){
      f.src=name;
    }
  });
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js?v=16').then(()=>console.log('PWA v16 ready'));
  // Force clear old caches
  caches.keys().then(keys=>keys.forEach(k=>{ if(k!=='app-omar-v16-clear') caches.delete(k); }));
}
// Clear black screen cache storage
try{ localStorage.removeItem('omar_theme_sync'); }catch(e){}
</script>
</body>
</html>
